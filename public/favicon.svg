<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7E7C4" />
      <stop offset="60%" stop-color="#D6B77A" />
      <stop offset="100%" stop-color="#8A6B32" />
    </radialGradient>
    <radialGradient id="rubyGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E8C7CB" />
      <stop offset="40%" stop-color="#B22240" />
      <stop offset="100%" stop-color="#4A0B1A" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Watch Ring / Loop -->
  <circle cx="32" cy="7" r="5" fill="none" stroke="url(#goldGlow)" stroke-width="2.5" />
  <rect x="30" y="10" width="4" height="4" rx="1" fill="url(#goldGlow)" />

  <!-- Outer Watch Case -->
  <circle cx="32" cy="36" r="24" fill="#20070F" stroke="url(#goldGlow)" stroke-width="3" filter="url(#shadow)" />
  <circle cx="32" cy="36" r="21" fill="none" stroke="#D6B77A" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Subtle Roman Dial Marks -->
  <circle cx="32" cy="18" r="1.2" fill="#D6B77A" />
  <circle cx="50" cy="36" r="1.2" fill="#D6B77A" />
  <circle cx="32" cy="54" r="1.2" fill="#D6B77A" />
  <circle cx="14" cy="36" r="1.2" fill="#D6B77A" />

  <!-- Center Monogram / Star in Antique Dial -->
  <circle cx="32" cy="36" r="12" fill="url(#rubyGlow)" filter="url(#shadow)" />
  <text x="32" y="42" font-family="serif" font-weight="bold" font-style="italic" font-size="14" text-anchor="middle" fill="#F7E7C4">I</text>

  <!-- Clock Hands -->
  <line x1="32" y1="36" x2="32" y2="23" stroke="#FFF4E8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="32" y1="36" x2="41" y2="36" stroke="#F7E7C4" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="32" cy="36" r="2" fill="#D6B77A" />
</svg>
